[project]
name = "model-registry"
version = "0.1.0"
description = "Model Registry Service for Agriculture AI Platform"
authors = [{name = "Agriculture AI Team"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.19",
    "botocore>=1.43.19",
    "fastapi>=0.136.3",
    "mlflow>=1.27.0",
    "onnx>=1.21.0",
    "onnxruntime>=1.26.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.50",
    "torch>=2.10.0",
    "uvicorn[standard]>=0.48.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
