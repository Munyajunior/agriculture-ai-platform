[project]
name = "ai-service"
version = "0.1.0"
description = "AI Inference Service for Agriculture Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agriculture-inference-sdk",
    "agriculture-shared-types",
    "asyncpg>=0.31.0",
    "boto3>=1.43.19",
    "celery>=5.6.3",
    "fastapi>=0.136.3",
    "numpy>=2.4.6",
    "onnx>=1.21.0",
    "onnxruntime>=1.26.0",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.50",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "uvicorn[standard]>=0.48.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
agriculture-inference-sdk = { workspace = true }
agriculture-shared-types = { workspace = true }
