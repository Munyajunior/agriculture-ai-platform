[project]
name = "agriculture-inference-sdk"
version = "0.1.0"
description = "Unified inference SDK for cloud and edge deployment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.6",
    "onnxruntime>=1.26.0",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "torch>=2.10.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"