# shared/types/pyproject.toml
[project]
name = "agriculture-shared-types"
version = "0.1.0"
description = "Shared types and utilities for agriculture AI platform"
authors = [{name = "F. Munya Jr"},{email = "fulmommunya@gmail.com"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "enum34>=1.1.10",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "setuptools>=82.0.1",
    "sqlalchemy>=2.0.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"